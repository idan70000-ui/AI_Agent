services:
  demo-service:
    build: ./backend/demo-service
    container_name: demo_service
    ports:
      - "3002:3002"
    environment:
      - NODE_ENV=production
      - MONGODB_URI=mongodb://mongo:27017/orders-api
    restart: unless-stopped
    depends_on:
      - mongo

  ops-agent:
    build: ./ops-agent
    container_name: ops_agent
    ports:
      - "3004:3000"
    environment:
      - NODE_ENV=production
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - MONGO_URI=${MONGO_URI}
      - DEMO_SERVICE_URL=http://demo_service:3002
    restart: unless-stopped
    depends_on:
      - demo-service

  mongo:
    image: mongo:7
    container_name: mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data: